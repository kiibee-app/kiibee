<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiibee Account Deleted</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f5f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding: 28px 16px">
          <table
            width="620"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="
              max-width: 620px;
              width: 100%;
              background: #ffffff;
              border-radius: 12px;
              padding: 32px 28px;
              border: 1px solid #e5e7eb;
            "
          >
            <tr>
              <td style="font-size: 22px; font-weight: 700; color: #111827">
                Account deletion confirmed
              </td>
            </tr>
            <tr>
              <td style="padding-top: 12px; font-size: 16px; line-height: 1.7">
                Hi {{name}},
              </td>
            </tr>
            <tr>
              <td style="padding-top: 10px; font-size: 16px; line-height: 1.7">
                Your Kiibee creator account deletion request has been approved by
                an admin, and your account has now been deleted.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 12px;
                  font-size: 14px;
                  line-height: 1.6;
                  color: #4b5563;
                "
              >
                If you did not request this deletion or have questions, please
                contact Kiibee support.
              </td>
            </tr>
            <tr>
              <td style="padding-top: 22px; font-size: 16px; line-height: 1.7">
                Best,<br />
                <strong>The Kiibee Team</strong>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
