<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiibee — Content Removed</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border-radius: 14px;
              overflow: hidden;
              box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            "
          >
            <tr>
              <td
                style="
                  background: #d9534f;
                  padding: 22px 28px;
                  text-align: center;
                  color: #ffffff;
                "
              >
                <p style="margin: 0; font-size: 20px; font-weight: 600">
                  Content removed
                </p>
                <p style="margin: 8px 0 0; font-size: 13px; opacity: 0.92">
                  An update from Kiibee Admin
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 28px;
                  font-size: 15px;
                  line-height: 1.65;
                  color: #1a1a1a;
                "
              >
                <p style="margin: 0 0 14px">Hi {{name}},</p>
                <p style="margin: 0 0 14px">
                  We’ve reviewed your content
                  <strong>“{{contentTitle}}”</strong> and it has been
                  <strong>removed</strong> from Kiibee.
                </p>
                <p style="margin: 0 0 18px; color: #555555">
                  The content is no longer available on the platform.
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="
                    border: 1px solid #e6e8eb;
                    border-radius: 10px;
                    background: #fafafa;
                  "
                >
                  <tr>
                    <td style="padding: 14px 16px">
                      <p
                        style="
                          margin: 0 0 6px;
                          font-size: 13px;
                          font-weight: 700;
                          color: #1a1a1a;
                        "
                      >
                        Reason from admin
                      </p>
                      <p
                        style="
                          margin: 0;
                          font-size: 14px;
                          line-height: 1.6;
                          color: #555555;
                        "
                      >
                        {{reason}}
                      </p>
                    </td>
                  </tr>
                </table>
                <p style="margin: 22px 0 0; color: #555555">
                  Best regards,<br />
                  <strong style="color: #1a1a1a">The Kiibee Team</strong>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
