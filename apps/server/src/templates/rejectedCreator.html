<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiibee — opdatering om udgiveransøgning</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f5f5; font-family:Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:20px;">
          
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; padding:30px; border-radius:8px;">
            
            <!-- Content -->
            <tr>
              <td style="font-size:16px; color:#333; line-height:1.6;">

                <p>Hej {{name}},</p>

                <p>
                  Tak for din interesse i at blive en del af Kiibee.<br/>
                  Efter at have gennemgået din ansøgning har vi besluttet ikke at gå videre på nuværende tidspunkt.
                </p>

                <p>
                  Du er velkommen til at ansøge igen senere, når dit indhold passer bedre til platformens fokus.
                </p>

                <p style="margin-top:30px;">
                  Med venlig hilsen,<br/>
                  – Kiibee-teamet
                </p>

              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
